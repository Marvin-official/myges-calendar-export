name: Update MyGES calendar

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours (UTC)
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Logs in to MyGES and builds the .ics file. Only this job sees the secrets.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check secrets
        env:
          MYGES_USERNAME: ${{ secrets.MYGES_USERNAME }}
          MYGES_PASSWORD: ${{ secrets.MYGES_PASSWORD }}
          CALENDAR_TOKEN: ${{ secrets.CALENDAR_TOKEN }}
        run: |
          for name in MYGES_USERNAME MYGES_PASSWORD CALENDAR_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; exit 1; fi
          done

      # The file name is the secret token, so the URL can't be guessed.
      # If this job fails, nothing is deployed and the last calendar stays online.
      - name: Build calendar
        env:
          MYGES_USERNAME: ${{ secrets.MYGES_USERNAME }}
          MYGES_PASSWORD: ${{ secrets.MYGES_PASSWORD }}
          CALENDAR_TOKEN: ${{ secrets.CALENDAR_TOKEN }}
        run: python myges_ics.py --out "public/${CALENDAR_TOKEN}.ics"

      # One artifact name per attempt: a re-run keeps the earlier attempt's
      # artifact, and deploy-pages fails if two share a name.
      - name: Upload calendar
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_attempt }}

  # Publishes the built file to GitHub Pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
